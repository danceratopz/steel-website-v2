name: Test
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
        with:
          enable-cache: false
          version: 0.8.22
          python-version: 3.12
      - name: Build site
        run: uv run zensical build --clean
